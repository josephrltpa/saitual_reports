name: Daily Mizoram VB-G RAM G Sync

on:
  schedule:
    # Runs daily at 01:00 UTC (6:30 AM IST)
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  sync-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install beautifulsoup4

      - name: Run Scraper & Data Aggregator
        run: |
          python scraper.py

      - name: Commit and Push Updated Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/passbook.json data/emr_url_dates_cache.json
          git diff --staged --quiet || (git commit -m "Auto-sync Mizoram report data: $(date -u +'%Y-%m-%d')" && git push)
